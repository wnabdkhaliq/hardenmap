- id: PERM-001
  title: /etc/passwd permissions
  cis_ref: "7.1.1"
  type: file_perm
  target: /etc/passwd
  max_mode: "0644"
  owner_uid: 0
  severity: medium
  fix: Run chmod 644 /etc/passwd and chown root:root /etc/passwd

- id: PERM-002
  title: /etc/group permissions
  cis_ref: "7.1.3"
  type: file_perm
  target: /etc/group
  max_mode: "0644"
  owner_uid: 0
  severity: medium
  fix: Run chmod 644 /etc/group and chown root:root /etc/group

- id: PERM-003
  title: /etc/shadow permissions
  cis_ref: "7.1.5"
  type: file_perm
  target: /etc/shadow
  max_mode: "0640"
  owner_uid: 0
  severity: high
  fix: Run chmod 640 /etc/shadow and chown root:shadow /etc/shadow

- id: SSH-001
  title: SSH root login enabled
  cis_ref: "5.1.20"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^PermitRootLogin\s+yes'
  fail_if: found
  severity: high
  fix: Set PermitRootLogin no in sshd_config, then restart sshd

- id: SSH-002
  title: SSH empty passwords allowed
  cis_ref: "5.1.19"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^PermitEmptyPasswords\s+yes'
  fail_if: found
  severity: high
  fix: Set PermitEmptyPasswords no in sshd_config, then restart sshd

- id: CRON-001
  title: Scripts run by root from cron
  cis_ref: "N/A"
  type: cron_scripts
  targets:
    - /etc/crontab
    - /etc/cron.d/*
  script_dirs:
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
  severity: low
  fix: Make sure every script root runs from cron is owned by root and not writable by others

- id: PERM-007
  title: World-writable files in sensitive folders
  cis_ref: "7.1.11"
  type: find_files
  condition: world_writable
  search_dirs:
    - /etc
    - /opt
    - /usr/local
  severity: medium
  fix: Remove write permission for others on each file (chmod o-w <file>)

- id: SUID-001
  title: SUID files in program folders
  cis_ref: "7.1.13"
  type: find_files
  condition: suid
  status_if_found: info
  search_dirs:
    - /usr/bin
    - /usr/sbin
    - /usr/local
  severity: low
  fix: Review each SUID file and remove the SUID bit if it is not needed (chmod u-s <file>)

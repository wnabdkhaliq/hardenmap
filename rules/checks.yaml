- id: PERM-001
  title: /etc/passwd permissions
  cis_ref: "7.1.1"
  type: file_perm
  target: /etc/passwd
  max_mode: "0644"
  owner_uid: 0
  severity: medium
  fix: Run chmod 644 /etc/passwd and chown root:root /etc/passwd


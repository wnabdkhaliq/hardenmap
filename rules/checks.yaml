- id: SSH-001
  title: SSH root login enabled
  cis_ref: "5.1.20"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^PermitRootLogin\s+yes'
  fail_if: found
  severity: high
  fix: Set PermitRootLogin no in sshd_config, then restart sshd

- id: SSH-002
  title: SSH empty passwords allowed
  cis_ref: "5.1.19"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^PermitEmptyPasswords\s+yes'
  fail_if: found
  severity: high
  fix: Set PermitEmptyPasswords no in sshd_config, then restart sshd

- id: SSH-003
  title: sshd_config permissions
  cis_ref: "5.1.1"
  type: file_perm
  target: /etc/ssh/sshd_config
  max_mode: "0600"
  owner_uid: 0
  severity: medium
  fix: Run chmod 600 /etc/ssh/sshd_config and chown root:root /etc/ssh/sshd_config

- id: SSH-004
  title: SSH IgnoreRhosts disabled
  cis_ref: "5.1.11"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^IgnoreRhosts\s+no'
  fail_if: found
  severity: medium
  fix: Set IgnoreRhosts yes in sshd_config, then restart sshd

- id: SSH-005
  title: SSH HostbasedAuthentication enabled
  cis_ref: "5.1.10"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^HostbasedAuthentication\s+yes'
  fail_if: found
  severity: medium
  fix: Set HostbasedAuthentication no in sshd_config, then restart sshd

- id: CRON-001
  title: Scripts run by root from cron
  cis_ref: "N/A"
  type: cron_scripts
  targets:
    - /etc/crontab
    - /etc/cron.d/*
  script_dirs:
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
  severity: low
  fix: Make sure every script root runs from cron is owned by root and not writable by others

- id: SUID-001
  title: SUID files in program folders
  cis_ref: "7.1.13"
  type: find_files
  condition: suid
  status_if_found: info
  search_dirs:
    - /usr/bin
    - /usr/sbin
    - /usr/local
  severity: low
  fix: Review each SUID file and remove the SUID bit if it is not needed (chmod u-s <file>)

- id: SSH-006
  title: Ensure X11 forwarding is disabled in SSH daemon config
  cis_ref: "5.2.5"
  type: file_contains
  targets:
    - /etc/ssh/sshd_config
    - /etc/ssh/sshd_config.d/*.conf
  pattern: '^X11Forwarding\s+yes'
  fail_if: found
  severity: low
  fix: Set X11Forwarding no in /etc/ssh/sshd_config and reload the ssh service
